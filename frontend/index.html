<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquestador Cloud PUCP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="login-view" class="login-wrap">
        <form id="login-form" class="login-card">
            <div class="brand">
                <div class="brand-mark">G3</div>
                <div>
                    <h1>Orquestador Cloud</h1>
                    <p class="muted">TEL141 · Linux + OpenStack</p>
                </div>
            </div>
            <label>Código de usuario
                <input id="login-codigo" autocomplete="username" required>
            </label>
            <label>Contraseña
                <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit" id="login-btn" class="btn primary block">Ingresar</button>
            <p id="login-error" class="error"></p>
        </form>
    </section>

    <section id="app-view" class="app hidden">
        <aside class="sidebar">
            <div class="brand small">
                <div class="brand-mark">G3</div>
                <div>
                    <strong>Orquestador</strong>
                    <p class="muted">Cloud PUCP</p>
                </div>
            </div>
            <nav id="nav"></nav>
            <div class="user-box">
                <div id="user-codigo" class="user-codigo"></div>
                <div id="user-rol" class="muted"></div>
                <button id="logout-btn" class="btn ghost block">Cerrar sesión</button>
            </div>
        </aside>
        <main id="main"></main>
    </section>

    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn ghost">Cancelar</button>
                <button id="modal-ok" class="btn primary">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <script src="app.js"></script>
</body>
</html>
