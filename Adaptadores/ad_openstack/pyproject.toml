[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-openstack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "orchestrator-contracts>=0.1.0",
    "pydantic>=2.6,<3",
    "requests>=2.31,<3",
    "temporalio>=1.5,<2",
]

[tool.setuptools]
packages = ["ad_openstack"]
package-dir = { "ad_openstack" = "." }
