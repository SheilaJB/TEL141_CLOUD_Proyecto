[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tel141-edge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.1,<4",
    "PyJWT[crypto]>=2.8,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
