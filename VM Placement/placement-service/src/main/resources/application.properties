spring.application.name=placement-service

spring.datasource.url=${PLACEMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/cloud_g3}
spring.datasource.username=${PLACEMENT_DATABASE_USERNAME:cloud_admin}
spring.datasource.password=${PLACEMENT_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

timefold.solver.termination.spent-limit=10s

placement.flavor-referencia=small-v1
placement.umbral-consolidacion-t=0.5
placement.w2=1
placement.s4-fraccion-w1=0.1
placement.s4-modo=PENALIZE
placement.epsilon-desempate=0.001

# Placement estocastico
# La demanda de cada VM :  N (mu, sigma a la 2) con mu = flavor y sigma = cv * mu.
#El disco se mantiene deterministico.
placement.estocastico.cv-cpu=${PLACEMENT_CV_CPU:0.0}
placement.estocastico.cv-ram=${PLACEMENT_CV_RAM:0.0}
placement.estocastico.epsilon-cpu=${PLACEMENT_EPSILON_CPU:0.05}
placement.estocastico.epsilon-ram=${PLACEMENT_EPSILON_RAM:0.01}

temporal.address=${TEMPORAL_ADDRESS:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:default}
temporal.task-queue=placement-queue
spring.main.web-application-type=none