[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-linux"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "orchestrator-contracts>=0.1.0",
    "pydantic>=2.6,<3",
    "temporalio>=1.5,<2",
]

[tool.setuptools]
packages = ["ad_linux", "ad_linux.cloudinit"]
package-dir = { "ad_linux" = "." }
