[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tel141-api-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103,<1",
    "httpx>=0.25,<1",
    "PyJWT[crypto]>=2.8,<3",
    "cryptography>=41.0,<44",
    "pydantic>=2.0,<3",
    "uvicorn[standard]>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
